<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TomoFlow Password Recovery</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      .card {
        background: #161616;
        border: 1px solid #2c2c2c;
        border-radius: 12px;
        padding: 24px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }

      .btn-deeplink {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        background: #ff5c5c;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>TomoFlow</h1>
      <p>We&#39;re opening the app so you can finish resetting your password.</p>
      <a class="btn-deeplink" id="openApp" href="tomoflow://auth-recovery">Open TomoFlow</a>
    </div>

    <script>
      const hash = window.location.hash;
      const deepLink = "tomoflow://auth-recovery" + (hash || "");

      const anchor = document.getElementById("openApp");
      if (anchor) {
        anchor.href = deepLink;
      }

      // Attempt automatic redirect to the app
      window.location.replace(deepLink);
    </script>
  </body>
</html>
